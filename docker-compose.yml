version: '3.8'

services:
  backend:
    build: .
    image: binance-bot-backend:v3
    container_name: bb_backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-binancebot}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bb_network

  frontend:
    build: ./frontend
    image: binance-bot-frontend:v3
    container_name: bb_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bb_network

  postgres:
    image: postgres:15-alpine
    container_name: bb_pg
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-binancebot}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-binancebot}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - bb_network

  redis:
    image: redis:7-alpine
    container_name: bb_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - bb_network

networks:
  bb_network:
    driver: bridge

volumes:
  pg_data:
  redis_data:
